<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Accueil - My ToDo</title>
</head>
<body>
  <div class="page">
    <!-- Navbar -->
    <div class="navbar">
      <div class="navbar-bg"></div>
      <div class="navbar-inner">
        <div class="title">My ToDo App</div>
        <div class="right">
          <a href="/taches/" class="link">
            <i class="f7-icons">list_bullet</i>
          </a>
        </div>
      </div>
    </div>
    
    <!-- Page Content -->
    <div class="page-content">
      <!-- Formulaire d'ajout -->
      <div class="block">
        <div class="list inset">
          <ul>
            <li class="item-content item-input">
              <div class="item-inner">
                <div class="item-input-wrap">
                  <input type="text" id="champ-tache" placeholder="Nouvelle tâche...">
                </div>
              </div>
            </li>
          </ul>
        </div>
        <a href="#" class="button button-fill button-large" id="btn-ajouter">
          Ajouter
        </a>
      </div>
      
      <!-- Modules Framework7 -->
      <div class="block-title">MODULES</div>
      <div class="list list-simple">
        <ul>
          <li class="item-content">
            <div class="item-media"><i class="f7-icons">book</i></div>
            <div class="item-inner">
              <div class="item-title">Module F7 - Introduction</div>
            </div>
          </li>
          <li class="item-content">
            <div class="item-media"><i class="f7-icons">book</i></div>
            <div class="item-inner">
              <div class="item-title">Module F7 - Session 1</div>
            </div>
          </li>
          <li class="item-content">
            <div class="item-media"><i class="f7-icons">book</i></div>
            <div class="item-inner">
              <div class="item-title">Module F7 - Session 2</div>
            </div>
          </li>
          <li class="item-content">
            <div class="item-media"><i class="f7-icons">book</i></div>
            <div class="item-inner">
              <div class="item-title">Module F7 - Session 3</div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    // Attendre que le DOM soit chargé
    document.addEventListener('DOMContentLoaded', function() {
      var $$ = Dom7;
      var app = window.app;
      
      if (!$$ || !app) {
        console.log('Attente du chargement...');
        return;
      }
      
      var CLE_STOCKAGE = 'ma-todo-taches';
      
      // Charger les tâches
      function chargerTaches() {
        var data = localStorage.getItem(CLE_STOCKAGE);
        if (data) {
          return JSON.parse(data);
        }
        return [];
      }
      
      // Sauvegarder
      function sauvegarder(taches) {
        localStorage.setItem(CLE_STOCKAGE, JSON.stringify(taches));
      }
      
      // Ajouter une tâche
      function ajouterTache(texte) {
        if (texte.trim() === '') {
          if (app.toast) {
            app.toast.create({ text: 'Veuillez saisir une tâche', closeTimeout: 1500 }).open();
          }
          return;
        }
        
        var taches = chargerTaches();
        var maxId = 0;
        for (var i = 0; i < taches.length; i++) {
          if (taches[i].id > maxId) maxId = taches[i].id;
        }
        
        taches.push({
          id: maxId + 1,
          texte: texte.trim(),
          fait: false
        });
        
        sauvegarder(taches);
        
        if (app.toast) {
          app.toast.create({ text: '✅ Tâche ajoutée !', closeTimeout: 1200 }).open();
        }
        
        // Rediriger vers la page des tâches
        if (app.views && app.views.main) {
          app.views.main.router.navigate('/taches/');
        }
      }
      
      // Événement ajout
      var btnAjouter = $$('#btn-ajouter');
      var champTache = $$('#champ-tache');
      
      if (btnAjouter.length) {
        btnAjouter.on('click', function(e) {
          e.preventDefault();
          ajouterTache(champTache.val());
          champTache.val('');
        });
      }
      
      if (champTache.length) {
        champTache.on('keypress', function(e) {
          if (e.keyCode === 13) {
            e.preventDefault();
            ajouterTache(champTache.val());
            champTache.val('');
          }
        });
      }
    });
  </script>
</body>
</html>
