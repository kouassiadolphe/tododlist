<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Mes Tâches - Ma ToDo</title>
</head>
<body>
  <div class="page">
    <!-- Navbar avec bouton retour -->
    <div class="navbar">
      <div class="navbar-bg"></div>
      <div class="navbar-inner">
        <div class="left">
          <a href="/" class="link back">
            <i class="f7-icons">arrow_left</i>
          </a>
        </div>
        <div class="title">Mes Tâches</div>
      </div>
    </div>
    
    <div class="page-content">
      <!-- Zone d'ajout -->
      <div class="block">
        <div class="list inset">
          <ul>
            <li class="item-content item-input">
              <div class="item-inner">
                <div class="item-input-wrap">
                  <input type="text" id="nouvelleTache" placeholder="Nouvelle tâche...">
                </div>
              </div>
            </li>
          </ul>
        </div>
        <a href="#" class="button button-fill button-large" id="btnAjouter">
          Ajouter
        </a>
      </div>
      
      <!-- Filtres -->
      <div class="block">
        <div class="row">
          <div class="col-33">
            <a href="#" class="button button-fill filtre-btn button-active" data-filtre="toutes">Toutes</a>
          </div>
          <div class="col-33">
            <a href="#" class="button filtre-btn" data-filtre="afaire">À faire</a>
          </div>
          <div class="col-33">
            <a href="#" class="button filtre-btn" data-filtre="faites">Faites</a>
          </div>
        </div>
      </div>
      
      <!-- Compteur -->
      <div class="block text-align-center">
        <div class="compteur" id="compteur">0 tâche(s) restante(s)</div>
      </div>
      
      <!-- Liste des tâches -->
      <div class="list">
        <ul id="listeTaches"></ul>
      </div>
    </div>
    
    <!-- Tabbar -->
    <div class="toolbar tabbar tabbar-labels">
      <div class="toolbar-inner">
        <a href="/" class="tab-link">
          <i class="f7-icons">house</i>
          <span class="tabbar-label">Accueil</span>
        </a>
        <a href="/taches/" class="tab-link tab-link-active">
          <i class="f7-icons">list_bullet</i>
          <span class="tabbar-label">Tâches</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var $$ = Dom7;
      var app = window.app;
      
      if (!app) {
        console.error('Framework7 non chargé');
        return;
      }
      
      // ========== DONNÉES ==========
      var STORAGE_KEY = 'matodo_taches_final';
      var filtreActuel = 'toutes';
      var taches = [];
      
      // ========== STOCKAGE ==========
      function sauvegarder() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(taches));
      }
      
      function charger() {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved && saved !== 'undefined') {
          try {
            taches = JSON.parse(saved);
          } catch(e) {
            taches = [];
          }
        }
        
        if (!taches || taches.length === 0) {
          taches = [
            { id: 1, texte: "Module F7 - Introduction", fait: false },
            { id: 2, texte: "Faire la Session 1", fait: false },
            { id: 3, texte: "Faire la Session 2", fait: true },
            { id: 4, texte: "Faire la Session 3", fait: false }
          ];
          sauvegarder();
        }
      }
      
      // ========== AFFICHAGE ==========
      function getTachesFiltrees() {
        if (filtreActuel === 'afaire') {
          return taches.filter(function(t) { return !t.fait; });
        } else if (filtreActuel === 'faites') {
          return taches.filter(function(t) { return t.fait; });
        }
        return taches.slice();
      }
      
      function afficher() {
        var tachesFiltrees = getTachesFiltrees();
        var ul = document.getElementById('listeTaches');
        if (!ul) return;
        
        ul.innerHTML = '';
        
        for (var i = 0; i < tachesFiltrees.length; i++) {
          var t = tachesFiltrees[i];
          var classeFait = t.fait ? 'tache-faite' : '';
          var checked = t.fait ? 'checked' : '';
          
          var li = document.createElement('li');
          li.className = 'item-content';
          li.setAttribute('data-id', t.id);
          li.innerHTML = 
            '<div class="item-media">' +
              '<label class="checkbox">' +
                '<input type="checkbox" class="task-checkbox" data-id="' + t.id + '" ' + checked + '>' +
                '<i class="icon-checkbox"></i>' +
              '</label>' +
            '</div>' +
            '<div class="item-inner">' +
              '<div class="item-title ' + classeFait + '">' + escapeHtml(t.texte) + '</div>' +
              '<div class="item-after">' +
                '<a href="#" class="btn-suppr" data-id="' + t.id + '">' +
                  '<i class="f7-icons">trash</i>' +
                '</a>' +
              '</div>' +
            '</div>';
          ul.appendChild(li);
        }
        
        var restantes = taches.filter(function(t) { return !t.fait; }).length;
        var compteur = document.getElementById('compteur');
        if (compteur) compteur.innerHTML = restantes + ' tâche(s) restante(s)';
      }
      
      function escapeHtml(texte) {
        if (!texte) return '';
        return texte.replace(/[&<>]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }
      
      // ========== ACTIONS ==========
      function ajouterTache(texte) {
        if (!texte || texte.trim() === '') {
          app.toast.create({ text: 'Veuillez saisir une tâche', closeTimeout: 1500 }).open();
          return;
        }
        
        var maxId = 0;
        for (var i = 0; i < taches.length; i++) {
          if (taches[i].id > maxId) maxId = taches[i].id;
        }
        
        taches.push({
          id: maxId + 1,
          texte: texte.trim(),
          fait: false
        });
        
        sauvegarder();
        afficher();
        app.toast.create({ text: ' Tâche ajoutée !', closeTimeout: 1200 }).open();
      }
      
      function supprimerTache(id) {
        var nouvelles = [];
        for (var i = 0; i < taches.length; i++) {
          if (taches[i].id != id) {
            nouvelles.push(taches[i]);
          }
        }
        taches = nouvelles;
        sauvegarder();
        afficher();
        app.toast.create({ text: ' Tâche supprimée', closeTimeout: 1200 }).open();
      }
      
      function basculerFait(id) {
        for (var i = 0; i < taches.length; i++) {
          if (taches[i].id == id) {
            taches[i].fait = !taches[i].fait;
            break;
          }
        }
        sauvegarder();
        afficher();
      }
      
      // ========== INITIALISATION ==========
      charger();
      afficher();
      
      // ========== ÉVÉNEMENTS ==========
      $$(document).on('click', '#btnAjouter', function(e) {
        e.preventDefault();
        var champ = $$('#nouvelleTache');
        ajouterTache(champ.val());
        champ.val('');
      });
      
      $$(document).on('keypress', '#nouvelleTache', function(e) {
        if (e.keyCode === 13) {
          e.preventDefault();
          $$('#btnAjouter').trigger('click');
        }
      });
      
      $$(document).on('click', '.btn-suppr', function(e) {
        e.preventDefault();
        var id = parseInt($$(this).attr('data-id'));
        supprimerTache(id);
      });
      
      $$(document).on('change', '.task-checkbox', function(e) {
        var id = parseInt($$(this).attr('data-id'));
        basculerFait(id);
      });
      
      $$(document).on('click', '.filtre-btn', function(e) {
        e.preventDefault();
        $$('.filtre-btn').removeClass('button-active');
        $$(this).addClass('button-active');
        filtreActuel = $$(this).attr('data-filtre');
        afficher();
      });
      
      console.log(' Page Tâches chargée');
    })();
  </script>
</body>
</html>
