<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Mes Tâches - My ToDo</title>
</head>
<body>
  <div class="page">
    <!-- Navbar avec bouton retour -->
    <div class="navbar">
      <div class="navbar-bg"></div>
      <div class="navbar-inner">
        <div class="left">
          <a href="/" class="link back">
            <i class="f7-icons">arrow_left</i>
          </a>
        </div>
        <div class="title">Mes Tâches</div>
      </div>
    </div>
    
    <div class="page-content">
      <!-- Zone d'ajout -->
      <div class="block">
        <div class="list inset">
          <ul>
            <li class="item-content item-input">
              <div class="item-inner">
                <div class="item-input-wrap">
                  <input type="text" id="champ-tache" placeholder="Nouvelle tâche...">
                </div>
              </div>
            </li>
          </ul>
        </div>
        <a href="#" class="button button-fill button-large" id="btn-ajouter">
          ➕ Ajouter
        </a>
      </div>
      
      <!-- Filtres -->
      <div class="block">
        <div class="row">
          <div class="col-33">
            <a href="#" class="button button-fill filtre-btn button-active" data-filtre="toutes">
              📋 Toutes
            </a>
          </div>
          <div class="col-33">
            <a href="#" class="button filtre-btn" data-filtre="afaire">
              ⭕ À faire
            </a>
          </div>
          <div class="col-33">
            <a href="#" class="button filtre-btn" data-filtre="faites">
              ✅ Faites
            </a>
          </div>
        </div>
      </div>
      
      <!-- Compteur -->
      <div class="block text-align-center">
        <div class="compteur" id="compteur">0 tâche(s) restante(s)</div>
      </div>
      
      <!-- Liste des tâches -->
      <div class="list">
        <ul class="liste-taches"></ul>
      </div>
    </div>
  </div>

  <script>
    // Attendre que le DOM soit chargé
    document.addEventListener('DOMContentLoaded', function() {
      var $$ = Dom7;
      var app = window.app;
      
      if (!$$ || !app) {
        console.error('Framework7 non chargé');
        return;
      }
      
      // ========== DONNÉES ==========
      var CLE_STOCKAGE = 'ma-todo-taches';
      var filtreActif = 'toutes';
      var taches = [];
      
      // ========== FONCTIONS ==========
      
      // Charger depuis localStorage
      function chargerTaches() {
        var data = localStorage.getItem(CLE_STOCKAGE);
        if (data) {
          taches = JSON.parse(data);
        } else {
          taches = [
            { id: 1, texte: "Module F7 - Introduction", fait: false },
            { id: 2, texte: "Module F7 - Session 1", fait: false },
            { id: 3, texte: "Module F7 - Session 2", fait: false },
            { id: 4, texte: "Module F7 - Session 3", fait: false }
          ];
          sauvegarder();
        }
      }
      
      // Sauvegarder dans localStorage
      function sauvegarder() {
        localStorage.setItem(CLE_STOCKAGE, JSON.stringify(taches));
        // Mettre à jour l'accueil si besoin
        window.dispatchEvent(new Event('storage'));
      }
      
      // Échapper le HTML
      function escapeHtml(texte) {
        if (!texte) return '';
        return texte.replace(/[&<>]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }
      
      // Générer une ligne de tâche
      function ligneTache(t) {
        var classeFait = t.fait ? 'tache-faite' : '';
        var checked = t.fait ? 'checked' : '';
        
        return '<li class="item-content" data-id="' + t.id + '">' +
          '<div class="item-media">' +
            '<label class="checkbox">' +
              '<input type="checkbox" class="task-checkbox" ' + checked + '>' +
              '<i class="icon-checkbox"></i>' +
            '</label>' +
          '</div>' +
          '<div class="item-inner">' +
            '<div class="item-title ' + classeFait + '">' + escapeHtml(t.texte) + '</div>' +
            '<div class="item-after">' +
              '<a href="#" class="btn-suppr"><i class="f7-icons">trash</i></a>' +
            '</div>' +
          '</div>' +
        '</li>';
      }
      
      // Filtrer les tâches visibles
      function tachesVisibles() {
        if (filtreActif === 'afaire') {
          return taches.filter(function(t) { return !t.fait; });
        }
        if (filtreActif === 'faites') {
          return taches.filter(function(t) { return t.fait; });
        }
        return taches.slice(); // Retourne une copie
      }
      
      // Afficher les tâches
      function afficher() {
        var tachesFiltrees = tachesVisibles();
        var listeHtml = '';
        for (var i = 0; i < tachesFiltrees.length; i++) {
          listeHtml += ligneTache(tachesFiltrees[i]);
        }
        $$('.liste-taches').html(listeHtml);
        
        // Mettre à jour le compteur
        var restantes = 0;
        for (var i = 0; i < taches.length; i++) {
          if (!taches[i].fait) restantes++;
        }
        $$('#compteur').text(restantes + ' tâche(s) restante(s)');
      }
      
      // Ajouter une tâche
      function ajouterTache(texte) {
        if (texte.trim() === '') {
          app.toast.create({ text: '⚠️ Veuillez saisir une tâche', closeTimeout: 1500 }).open();
          return;
        }
        
        var maxId = 0;
        for (var i = 0; i < taches.length; i++) {
          if (taches[i].id > maxId) maxId = taches[i].id;
        }
        
        taches.push({
          id: maxId + 1,
          texte: texte.trim(),
          fait: false
        });
        
        sauvegarder();
        afficher();
        
        app.toast.create({ text: '✅ Tâche ajoutée !', closeTimeout: 1200 }).open();
      }
      
      // Supprimer une tâche
      function supprimerTache(id) {
        var nouveauTaches = [];
        for (var i = 0; i < taches.length; i++) {
          if (taches[i].id !== parseInt(id, 10)) {
            nouveauTaches.push(taches[i]);
          }
        }
        taches = nouveauTaches;
        sauvegarder();
        afficher();
        
        app.toast.create({ text: '🗑️ Tâche supprimée', closeTimeout: 1200 }).open();
      }
      
      // Basculer l'état d'une tâche
      function basculerTache(id) {
        for (var i = 0; i < taches.length; i++) {
          if (taches[i].id === parseInt(id, 10)) {
            taches[i].fait = !taches[i].fait;
            break;
          }
        }
        sauvegarder();
        afficher();
      }
      
      // ========== INITIALISATION ==========
      chargerTaches();
      afficher();
      
      // ========== ÉVÉNEMENTS (Délégation) ==========
      
      // Ajouter
      $$(document).on('click', '#btn-ajouter', function(e) {
        e.preventDefault();
        var champ = $$('#champ-tache');
        ajouterTache(champ.val());
        champ.val('');
      });
      
      // Supprimer
      $$(document).on('click', '.btn-suppr', function(e) {
        e.preventDefault();
        var id = $$(this).parents('.item-content').attr('data-id');
        supprimerTache(id);
      });
      
      // Cocher/Décocher
      $$(document).on('change', '.task-checkbox', function(e) {
        var id = $$(this).parents('.item-content').attr('data-id');
        basculerTache(id);
      });
      
      // Filtres
      $$(document).on('click', '.filtre-btn', function(e) {
        e.preventDefault();
        $$('.filtre-btn').removeClass('button-active');
        $$(this).addClass('button-active');
        filtreActif = $$(this).attr('data-filtre');
        afficher();
      });
      
      // Touche Entrée
      $$('#champ-tache').on('keypress', function(e) {
        if (e.keyCode === 13) {
          e.preventDefault();
          $$('#btn-ajouter').trigger('click');
        }
      });
      
      console.log('✅ Page Tâches chargée - Toutes les fonctionnalités sont actives');
    });
  </script>
</body>
</html>
