<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8590c" />
    <title>Ma ToDo</title>

    <link rel="stylesheet" href="lib/framework7-bundle.min.css" />
    <link rel="stylesheet" href="lib/framework7-icons/css/framework7-icons.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="view view-main view-init safe-areas">
            <div class="page">
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner">
                        <div class="title">Ma ToDo</div>
                    </div>
                </div>

                <div class="page-content">

                    <div class="list no-hairlines-md">
                        <ul>
                            <li class="item-content item-input">
                                <div class="item-inner">
                                    <div class="item-title item-label">Nouvelle tâche</div>
                                    <div class="item-input-wrap">
                                        <input type="text" id="champ-tache" placeholder="Ex: Acheter du pain..." />
                                        <span class="input-clear-button"></span>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <div class="block">
                        <button class="button button-fill color-orange" id="btn-ajouter">Ajouter la tâche</button>
                    </div>

                    <div class="block block-strong display-flex justify-content-space-between align-items-center">
                        <div>Tâches en cours : <b id="compteur" class="text-color-orange">0</b></div>
                    </div>

                    <div class="block segment segment-raised">
                        <button class="button btn-filtre button-active" data-filtre="toutes">Toutes</button>
                        <button class="button btn-filtre" data-filtre="a-faire">À faire</button>
                        <button class="button btn-filtre" data-filtre="faites">Faites</button>
                    </div>

                    <div class="list todo-list">
                        <ul class="liste-taches"></ul>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Framework7 (JS) -->
    <script src="lib/framework7-bundle.min.js"></script>
    
    <!-- AJOUTE CETTE LIGNE ICI POUR CHARGER LES ROUTES -->
    <script src="js/routes.js"></script>
    
    <!-- Ton Script principal de gestion -->
    <script src="js/app.js"></script>
</body>
</html>
